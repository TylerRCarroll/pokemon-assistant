# Builds a signed Android APK and publishes it as a GitHub Release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Obtainium (https://github.com/ImranR98/Obtainium) installs and updates the app from these releases.
#
# One-time setup, repo Settings -> Secrets and variables -> Actions (see README, "Android app"):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The signing secrets aren't set up yet. See the README section 'Android app'."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # the web app, built for the APK (served from its root, no service worker), then copied in
      - run: npx tsc -b && npx vite build --mode android
      - run: npx cap sync android
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # the run number only grows, which Android needs to accept each release as an update
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "PokePlanner-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "PokePlanner-${GITHUB_REF_NAME}.apk" \
            --title "PokéPlanner $GITHUB_REF_NAME" --generate-notes
